<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boner?</title>
</head>
<body>
    <p id="status">loading script...</p>

    <div id="lqr-params"></div>
    <button onclick="send_lqr_params()">Update params and recalc</button><br>
    <button onclick="set_running(true)" class="bigbutton">ON</button>
    <button onclick="set_running(false)" class="bigbutton">OFF</button>

    <br><br>
    <textarea id="log"></textarea><br>

    <input type="range" value = "0" max="1" step = "0.0001" id="speed"> Speed <br>
    <input type="range" value = "0.5" max="1" step = "0.0001" id="dir"> Dir <br>

    <div id="touchinput">
        <div id="marker"></div>

    </div>

    <style>
        .bigbutton{
            width: 10em;
            height: 5em;
        }

        #log{
            width: 20em;
            height: 20em;
        }

        #touchinput {
            width: 20em;
            height: 20em;
            background-color: orange;
            touch-action: none;
            padding-top: 0.5em;
        }

        #marker{
            width: 1em;
            height: 1em;
            background-color: red;
            position: relative;
            margin-left: -0.5em;
            margin-top: -0.5em;
        }
    </style>
</body>
